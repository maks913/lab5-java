<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Update Company</title>
    <link th:href="@{/webjars/bootstrap/5.3.8/dist/css/bootstrap.min.css}" rel="stylesheet"/>
    <link th:href="@{/webjars/bootstrap-icons/1.13.2/font/bootstrap-icons.css}" rel="stylesheet">
</head>
<body>
  <div th:insert="~{fragments/header::header}"></div>

  <main class="container">
    <div class="mb-4">
      <a th:href="@{/companies}"
         class="text-decoration-none small">
        <i class="bi bi-arrow-left me-1"></i>
        Back to companies
      </a>

      <h1 class="mt-3 mb-2">Update company</h1>
      <p class="mb-0">
        Edit company information and contact details.
      </p>
    </div>

    <form th:action="@{/companies/update}"
          method="post"
          th:object="${company}"
          class="card p-3">

      <div class="form-header">
        <div class="d-flex align-items-center gap-3">
          <div class="rounded-3 p-3">
            <i class="bi bi-building-gear fs-4"></i>
          </div>

          <div>
            <h5 class="mb-1">Company information</h5>
            <p class="small mb-0">
              Update the details of this company.
            </p>
          </div>
        </div>
      </div>

      <div class="card-body">
        <input type="hidden" th:field="*{id}">
        <div class="row g-4">

          <div class="col-12">
            <label for="name" class="form-label">
              <i class="bi bi-building field-icon"></i>
              Company name
            </label>

            <input type="text"
                   class="form-control"
                   id="name"
                   th:field="*{name}"
                   placeholder="e.g. Tech Solutions"
                   maxlength="30"
                   required>
          </div>

          <div class="col-12">
            <label for="quantityEmployees" class="form-label">
              <i class="bi bi-people"></i>
              Number of employees
            </label>

            <input type="number"
                   class="form-control"
                   id="quantityEmployees"
                   th:field="*{quantityEmployees}"
                   placeholder="e.g. 50"
                   min="0"
                   step="1">

            <div class="form-text">
              Specify the approximate number of employees.
            </div>
          </div>

          <div class="col-12">
            <label for="description" class="form-label">
              <i class="bi bi-text-paragraph"></i>
              Company description
            </label>

            <textarea class="form-control"
                      id="description"
                      th:field="*{description}"
                      placeholder="Describe the company's activities and specialization..."
                      rows="5"></textarea>
          </div>

        </div>
        <hr class="my-4 opacity-25">
        <div class="mb-3">
          <h5 class="fw-bold mb-1">
            <i class="bi bi-person-badge text-primary me-2"></i>
            Contact person
          </h5>

          <p class="small mb-0">
            Select the user responsible for this company.
          </p>
        </div>
        <label for="user" class="form-label">Company owner</label>
        <select class="form-select"
                id="user"
                th:field="*{user.id}"
                required>

          <option th:each="user : ${users}"
                  th:value="${user.id}"
                  th:text="${user.firstName + ' ' + user.lastName
                            + ' (' + user.email + ')'}">
          </option>
        </select>
      </div>

      <div class="card-footer">
        <a th:href="@{/companies}"
           class="btn btn-outline-secondary">
          <i class="bi bi-x-lg me-1"></i>
          Cancel
        </a>

        <button type="submit" class="btn btn-primary">
          <i class="bi bi-check2-circle me-1"></i>
          Save changes
        </button>
      </div>
    </form>
  </main>
</body>
</html>
