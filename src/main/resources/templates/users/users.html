<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Index Page</title>
    <link th:href="@{/webjars/bootstrap/5.3.8/dist/css/bootstrap.min.css}" rel="stylesheet" />
    <link th:href="@{/webjars/bootstrap-icons/1.13.2/font/bootstrap-icons.css}" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/confirm_modal :: confirmModal}"></div>
<div th:insert="~{fragments/header::header}"></div>

<main class="container py-2">
    <div class="d-flex flex-row justify-content-between gap-3 mb-4 align-items-end">
        <div class="">
            <h1 class="mb-1">Users</h1>
            <p class="mb-0">
                Manage registered users
            </p>
        </div>

        <a th:href="@{/users/new}" class="btn btn-primary h-25">
            <i class="bi bi-person-plus me-2"></i>
            Create User
        </a>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="card-body p-0">

            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">

                    <thead class="table-light">
                    <tr>
                        <th class="ps-4">ID</th>
                        <th>Created At</th>
                        <th>Email</th>
                        <th>First Name</th>
                        <th>Last Name</th>
                        <th class="text-end pe-5">Actions</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="user : ${users}">
                        <td th:text="${user.id}"></td>
                        <td th:text="${user.createdAt}"></td>
                        <td>
                            <i class="bi bi-envelope"></i>
                            <span th:text="${user.email}"></span>
                        </td>

                        <td th:text="${user.firstName}"></td>
                        <td th:text="${user.lastName}"></td>

                        <td class="text-end pe-4">
                            <div class="d-inline-flex gap-2">
                                <a th:href="@{/users/{id}(id=${user.id})}" class="btn btn-sm btn-outline-primary">
                                    <i class="bi bi-pencil-square"></i>
                                </a>

                                <a th:href="@{/users/detail/{id}(id=${user.id})}" class="btn btn-sm btn-outline-secondary">
                                    <i class="bi bi-eye"></i>
                                </a>

                                <button type="button"
                                        class="btn btn-sm btn-outline-danger"
                                        data-bs-toggle="modal"
                                        data-bs-target="#confirmModal"
                                        th:onclick="|setActionInModal('@{/users/delete/{id}(id=${user.id})}')|">
                                    <i class="bi bi-trash3"></i>
                                </button>
                            </div>
                        </td>
                    </tr>

                    <tr th:if="${users.isEmpty()}">
                        <td class="text-center py-5">
                            <i class="bi bi-people"></i>
                            <p class="mt-3 mb-1">
                                No users found
                            </p>
                            <p class="mb-0">
                                Create a user to get started.
                            </p>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<script th:src="@{/webjars/bootstrap/5.3.8/dist/js/bootstrap.bundle.min.js}"></script>
<script>
    setActionInModal = (url) => {
        const form = document.getElementById("confirmForm");

        form.action = url;
    }
</script>
</body>
</html>
