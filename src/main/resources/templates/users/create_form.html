<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create Form</title>
    <link th:href="@{/webjars/bootstrap/5.3.8/dist/css/bootstrap.min.css}" rel="stylesheet"/>
    <link th:href="@{/webjars/bootstrap-icons/1.13.2/font/bootstrap-icons.css}" rel="stylesheet">
</head>
<body>
<div th:insert="~{fragments/header::header}"></div>

<main class="container py-3">

    <div class="mb-4 mx-auto" style="max-width: 700px;">
        <a th:href="@{/users}"
           class="text-decoration-none">
            <i class="bi bi-arrow-left me-2"></i>
            Back to Users
        </a>

        <h1 class="fw-bold mt-3 mb-1">Create User</h1>
        <p class="mb-0">
            Add a new user to Job Center.
        </p>
    </div>

    <div class="card border-0 shadow-sm mx-auto"
         style="max-width: 700px;">

        <div class="card-body p-4 p-md-5">
            <div class="d-flex align-items-center gap-3 mb-4">
                <div class="rounded-3 d-flex align-items-center justify-content-center"
                     style="width: 52px; height: 52px;">
                    <i class="bi bi-person-plus fs-3"></i>
                </div>
                <div>
                    <h5 class="mb-1">New User</h5>
                    <span class="small">
                        Enter the user's information
                    </span>
                </div>
            </div>

            <form th:action="@{/users/save}"
                  th:object="${user}"
                  method="post">

                <div class="mb-3">
                    <label for="firstName" class="form-label">
                        First Name
                    </label>

                    <div class="input-group">
                        <span class="input-group-text bg-white">
                            <i class="bi bi-person"></i>
                        </span>

                        <input type="text"
                               class="form-control"
                               id="firstName"
                               th:field="*{firstName}"
                               placeholder="Enter first name"
                               required>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="lastName" class="form-label">
                        Last Name
                    </label>

                    <div class="input-group">
                        <span class="input-group-text bg-white">
                            <i class="bi bi-person text-secondary"></i>
                        </span>
                        <input type="text"
                               class="form-control"
                               id="lastName"
                               th:field="*{lastName}"
                               placeholder="Enter last name"
                               required>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="email" class="form-label">
                        Email Address
                    </label>
                    <div class="input-group">
                        <span class="input-group-text bg-white">
                            <i class="bi bi-envelope"></i>
                        </span>

                        <input type="email"
                               class="form-control"
                               id="email"
                               th:field="*{email}"
                               placeholder="name@example.com"
                               required>
                    </div>
                </div>
                <hr class="mb-4">
                <div class="d-flex flex-column justify-content-end gap-2">
                    <a th:href="@{/users}"
                       class="btn btn-outline-secondary">
                        Cancel
                    </a>

                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-person-check me-2"></i>
                        Create User
                    </button>
                </div>
            </form>
        </div>
    </div>

</main>
</body>
</html>
