<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Vacancies</title>
    <link th:href="@{/webjars/bootstrap/5.3.8/dist/css/bootstrap.min.css}" rel="stylesheet"/>
    <link th:href="@{/webjars/bootstrap-icons/1.13.2/font/bootstrap-icons.css}" rel="stylesheet">
</head>
<body>
<div th:insert="~{fragments/header::header}"></div>
<div th:replace="~{fragments/confirm_modal::confirmModal}"></div>

<main class="container py-5">
    <div class="d-flex flex-row justify-content-between align-items-sm-center gap-3 mb-4">
        <div>
            <h1 class="mb-1">Vacancies</h1>
            <p class="mb-0">
                Explore and manage job opportunities.
            </p>
        </div>
        <a th:href="@{/vacancies/new}" class="btn btn-primary">
            <i class="bi bi-plus-lg me-2"></i>
            Create Vacancy
        </a>
    </div>
    <div class="row g-4">
        <div class="col-12"
             th:if="${#lists.isEmpty(vacancies)}">
            <div class="card border-0 shadow-sm">
                <div class="card-body text-center py-5">
                    <i class="bi bi-briefcase fs-1 text-secondary"></i>
                    <h5 class="mt-3">No vacancies found</h5>
                    <p class="text-secondary mb-0">
                        Create a vacancy to get started.
                    </p>
                </div>
            </div>
        </div>
        <div class="col-12 col-md-6 col-xl-4" th:each="vacancy : ${vacancies}">
            <div class="card h-100 border-0 shadow-sm">

                <div class="card-body p-4">
                    <div class="d-flex justify-content-between align-items-start gap-3 mb-3">
                        <div>
                            <h5 class="fw-bold mb-1"
                                th:text="${vacancy.title}">
                                Vacancy title
                            </h5>

                            <div class="small">
                                <i class="bi bi-building me-1"></i>
                                <span th:text="${vacancy.company.name}">
                                    Company
                                </span>
                            </div>
                        </div>

                        <span class="badge text-bg-success fs-6"
                              th:if="${vacancy.salary != null}"
                              th:text="${#numbers.formatDecimal(vacancy.salary, 1, 2)}">
                            0.00
                        </span>
                    </div>

                    <div class="small mb-3">
                        <i class="bi bi-geo-alt me-2"></i>
                        <span th:text="${vacancy.city != null ? vacancy.city : 'Location not specified'}">
                            City
                        </span>
                    </div>
                    <p class="mb-4" th:text="${vacancy.description}"></p>
                    <hr>
                    <div class="d-flex flex-wrap gap-2">
                        <a th:href="@{/vacancies/detail/{id}(id=${vacancy.id})}"
                           class="btn btn-outline-primary btn-sm">
                            <i class="bi bi-eye me-1"></i>
                            View
                        </a>

                        <a th:href="@{/vacancies/update/{id}(id=${vacancy.id})}"
                           class="btn btn-outline-secondary btn-sm">
                            <i class="bi bi-pencil-square me-1"></i>
                            Update
                        </a>

                        <button type="button"
                                class="btn btn-outline-danger btn-sm ms-sm-auto"
                                data-bs-toggle="modal"
                                data-bs-target="#confirmModal"
                                th:onclick="|setActionInModal('@{/vacancies/delete/{id}(id=${vacancy.id})}')|">
                            <i class="bi bi-trash3 me-1"></i>
                            Delete
                        </button>

                    </div>

                </div>
            </div>

        </div>
    </div>
</main>


<script th:src="@{/webjars/bootstrap/5.3.8/dist/js/bootstrap.bundle.min.js}"></script>
<script>
    setActionInModal = (url) => {
        const form = document.getElementById("confirmForm");
        form.action = url;
    }
</script>
</body>
</html>
