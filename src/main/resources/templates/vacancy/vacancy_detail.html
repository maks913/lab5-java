<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Vacancy Detail</title>
    <link th:href="@{/webjars/bootstrap/5.3.8/dist/css/bootstrap.min.css}" rel="stylesheet"/>
    <link th:href="@{/webjars/bootstrap-icons/1.13.2/font/bootstrap-icons.css}" rel="stylesheet">
</head>
<body>
<main class="container py-5">
    <a th:href="@{/vacancies}"
       class="text-decoration-none">
        <i class="bi bi-arrow-left me-2"></i>
        Back to Vacancies
    </a>
    <div class="d-flex flex-row justify-content-between align-items-md-start gap-3 mt-4 mb-4">
        <div>
            <span class="badge mb-3">
                <i class="bi bi-briefcase me-1"></i>
                Job Vacancy
            </span>

            <h1 class="fw-bold mb-2"
                th:text="${vacancy.title}">
                Vacancy title
            </h1>

            <div class="text-secondary">
                <i class="bi bi-building me-2"></i>
                <span th:text="${vacancy.company.name}">
                    Company name
                </span>
            </div>
        </div>

        <div class="text-md-end">
            <div class="small mb-1">Salary</div>

            <h3 class="text-success mb-0"
                th:if="${vacancy.salary != null}"
                th:text="${vacancy.salary}">
            </h3>

            <span th:if="${vacancy.salary == null}">
                Not specified
            </span>
        </div>
    </div>

    <div class="row g-4">
        <div class="col-12 col-lg-8">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body p-4 p-md-5">
                    <h4 class=" mb-4">
                        <i class="bi bi-file-text me-2"></i>
                        Job Description
                    </h4>

                    <p style="white-space: pre-line;"
                       th:text="${vacancy.description}">
                    </p>
                    <hr class="my-4">
                    <h5 class="mb-3">Location</h5>

                    <div class="d-flex align-items-center gap-3">
                        <div class="rounded-3 d-flex align-items-center justify-content-center"
                             style="width: 48px; height: 48px;">
                            <i class="bi bi-geo-alt fs-4"></i>
                        </div>

                        <div>
                            <div>City</div>
                            <div th:text="${vacancy.city}"> </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
        <div class="col-12 col-lg-4">
            <div class="card border-0 shadow-sm mb-4">
                <div class="card-body p-4">
                    <h5 class="mb-4">
                        <i class="bi bi-building me-2"></i>
                        About the Company
                    </h5>

                    <h5 th:text="${vacancy.company.name}">
                        Company name
                    </h5>

                    <div class="small mb-3">
                        <i class="bi bi-people me-2"></i>
                        <span th:text="${vacancy.company.quantityEmployees}">
                            Employees
                        </span>
                        <span> employees</span>
                    </div>

                    <p class="mb-0" th:text="${vacancy.company.description}"></p>
                </div>
            </div>

            <div class="card border-0 shadow-sm">
                <div class="card-body p-4">
                    <h5 class="mb-3">
                        <i class="bi bi-person-vcard me-2"></i>
                        Contact Person
                    </h5>

                    <div class="d-flex align-items-center gap-3">
                        <div class="rounded-circle d-flex align-items-center justify-content-center"
                             style="width: 48px; height: 48px;">
                            <i class="bi bi-person fs-4"></i>
                        </div>

                        <div>
                            <div th:text="${vacancy.company.user.firstName
                                     + ' ' + vacancy.company.user.lastName}">
                                Contact name
                            </div>

                            <div class="small">
                                Company representative
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>

    </div>
    <div class="d-flex justify-content-end gap-2 mt-4">
        <a th:href="@{/vacancies}"
           class="btn btn-outline-secondary">
            <i class="bi bi-arrow-left me-2"></i>
            Back
        </a>

        <a th:href="@{/vacancies/update/{id}(id=${vacancy.id})}"
           class="btn btn-primary">
            <i class="bi bi-pencil-square me-2"></i>
            Edit Vacancy
        </a>
    </div>

</main>
</body>
</html>
